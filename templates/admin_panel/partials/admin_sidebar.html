{% load static %}
<aside class="dashboard-sidebar" id="dashboardSidebar">
    <div class="dashboard-sidebar-top">
        <a href="{% url 'admin_dashboard' %}" class="dashboard-logo" aria-label="SafeBooks admin dashboard">
            <span class="dashboard-logo-glyph">
                <img src="{% static 'images/Logo_safebooks.png' %}" alt="" class="dashboard-logo-image logo-light" aria-hidden="true" />
                <img src="{% static 'images/Logo_safebooks_dark.png' %}" alt="" class="dashboard-logo-image logo-dark" aria-hidden="true" />
            </span>
            <span class="dashboard-logo-text">SafeBooks</span>
        </a>
        <button class="btn dashboard-menu-toggle dashboard-collapse-btn d-none d-lg-inline-flex" type="button" id="sidebarCollapseToggle" aria-label="Collapse sidebar" aria-expanded="true">
            <i class="bi bi-layout-sidebar-inset" id="sidebarCollapseIcon"></i>
        </button>
    </div>
    <p class="dashboard-sidebar-label">System Admin</p>

    <nav class="dashboard-nav" aria-label="Admin navigation">
        <a href="{% url 'admin_dashboard' %}" class="dashboard-nav-item{% if active_admin_nav == 'dashboard' %} active{% endif %}"{% if active_admin_nav == 'dashboard' %} aria-current="page"{% endif %}><i class="bi bi-speedometer2"></i><span>Admin Home</span></a>
        <a href="{% url 'admin_bookkeepers' %}" class="dashboard-nav-item{% if active_admin_nav == 'bookkeepers' %} active{% endif %}"{% if active_admin_nav == 'bookkeepers' %} aria-current="page"{% endif %}><i class="bi bi-people"></i><span>Bookkeepers</span></a>
        <a href="{% url 'admin_approvals' %}" class="dashboard-nav-item{% if active_admin_nav == 'approvals' %} active{% endif %}"{% if active_admin_nav == 'approvals' %} aria-current="page"{% endif %}><i class="bi bi-check2-circle"></i><span>Approvals</span></a>
        <a href="{% url 'admin_audit_log' %}" class="dashboard-nav-item{% if active_admin_nav == 'audit_log' %} active{% endif %}"{% if active_admin_nav == 'audit_log' %} aria-current="page"{% endif %}><i class="bi bi-journal-check"></i><span>Audit Log</span></a>
        <a href="{% url 'admin_system_settings' %}" class="dashboard-nav-item{% if active_admin_nav == 'system_settings' %} active{% endif %}"{% if active_admin_nav == 'system_settings' %} aria-current="page"{% endif %}><i class="bi bi-gear"></i><span>System Settings</span></a>
    </nav>

    <a href="{% url 'login' %}" class="dashboard-landing-link" data-admin-logout>
        <i class="bi bi-box-arrow-left"></i>
        <span>Logout</span>
    </a>
</aside>
